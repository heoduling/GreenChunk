name: GreenChunk
version: '${version}'
main: th.in.midnight_network.greenchunk.GreenChunkPlugin
description: 适用于 Folia / Shiroha 26.2 的史莱姆区块查询与三维显示插件。
api-version: '26.2'
folia-supported: true
authors: [Midnight Network]

commands:
  slime:
    description: 查询当前位置是否属于史莱姆区块。
    usage: /slime
    permission: greenchunk.check
    permission-message: '§c你没有权限执行此操作。'
  slimemap:
    description: 打开史莱姆区块地图。
    usage: /slimemap
    permission: greenchunk.map
    permission-message: '§c你没有权限执行此操作。'
  greenchunkreload:
    description: 重新加载 GreenChunk 配置。
    usage: /greenchunkreload
    aliases: [slimereload]
    permission: greenchunk.reload
    permission-message: '§c你没有权限执行此操作。'
  slimevisual:
    description: 开启或关闭仅自己可见的史莱姆区块三维显示。
    usage: /slimevisual
    permission: greenchunk.visual
    permission-message: '§c你没有权限执行此操作。'

permissions:
  greenchunk.check:
    description: 查询当前区块。
    default: true
  greenchunk.map:
    description: 使用史莱姆区块地图命令。
    default: true
  greenchunk.item.map:
    description: 潜行并右键使用指定物品打开地图。
    default: true
  greenchunk.map.item:
    description: 旧版物品地图权限的兼容别名。
    default: true
    children:
      greenchunk.item.map: true
  greenchunk.reload:
    description: 重新加载 GreenChunk 配置。
    default: op
  greenchunk.visual:
    description: 使用仅自己可见的史莱姆区块三维显示。
    default: true
