plugins {
    id 'java'
}

group = 'th.in.midnight_network'
version = '2.0.0-1'

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = uri('https://repo.papermc.io/repository/maven-public/')
    }
}

dependencies {
    if (project.hasProperty('serverLibraries')) {
        compileOnly fileTree(project.property('serverLibraries')) { include '*.jar' }
        testImplementation fileTree(project.property('serverLibraries')) { include '*.jar' }
    } else {
        compileOnly 'dev.folia:folia-api:26.2.build.6-beta'
        testImplementation 'dev.folia:folia-api:26.2.build.6-beta'
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.0.3'
}

test { useJUnitPlatform() }

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

processResources {
    def properties = [version: project.version]
    inputs.properties(properties)
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(properties)
    }
}

jar {
    archiveBaseName = 'GreenChunk'
}

tasks.register('verifyPluginJar') {
    dependsOn jar
    inputs.file(tasks.jar.archiveFile)
    doLast {
        new java.util.zip.ZipFile(tasks.jar.archiveFile.get().asFile).withCloseable { zip ->
            if (zip.getEntry('th/in/midnight_network/greenchunk/GreenChunkPlugin.class') == null) {
                throw new GradleException('Plugin entry point missing')
            }
            zip.entries().each { entry ->
                if (entry.name.endsWith('.class')) {
                    def bytes = zip.getInputStream(entry).withCloseable { it.readAllBytes() }
                    def constants = new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                    ['SystemMetrics', 'onEnableInj', 'panel.bstats.co', 'java/net/URLClassLoader'].each { marker ->
                        if (constants.contains(marker)) throw new GradleException("Forbidden loader marker in ${entry.name}")
                    }
                }
            }
        }
    }
}
check.dependsOn verifyPluginJar
